name: Close pull requests

# pull_request_target runs this file from the default branch with a token that can close the PR.
# It must never check out or run the PR's code.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: ${{ !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: >-
          gh pr close "$NUMBER" --repo "$REPO" --comment
          "Thank you for the pull request. This project does not accept pull requests, so it has been
          closed automatically. Please open an issue instead: https://github.com/$REPO/issues/new
          (see https://github.com/$REPO/blob/main/CONTRIBUTING.md)."
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
